<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #fff5f7 0%, #f8d7da 50%, #f4c5cc 100%);
    color: #2b1a22; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; overflow: hidden; position: relative;
  }
  body::before, body::after {
    content: ''; position: absolute; border-radius: 50%; pointer-events: none;
  }
  body::before {
    width: 480px; height: 480px; top: -150px; right: -120px;
    background: radial-gradient(circle, rgba(255,255,255,0.6) 0%, transparent 70%);
  }
  body::after {
    width: 380px; height: 380px; bottom: -120px; left: -100px;
    background: radial-gradient(circle, rgba(201, 169, 110, 0.25) 0%, transparent 70%);
  }
  .wrap {
    text-align: center; max-width: 560px; position: relative; z-index: 2;
    background: rgba(255,255,255,0.7); backdrop-filter: blur(20px);
    padding: 56px 40px; border-radius: 32px;
    box-shadow: 0 20px 50px rgba(233, 30, 140, 0.18);
    border: 1px solid rgba(255,255,255,0.6);
  }
  .code {
    font-family: 'Playfair Display', serif; font-size: clamp(5rem, 14vw, 8rem);
    font-weight: 700; line-height: 1;
    background: linear-gradient(135deg, #E91E8C 0%, #C9A96E 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; margin-bottom: 16px;
  }
  h1 {
    font-family: 'Playfair Display', serif; font-size: clamp(1.4rem, 4vw, 2rem);
    margin-bottom: 14px; font-weight: 600;
  }
  p { color: #6b5560; margin-bottom: 32px; font-size: 1rem; }
  .btn {
    display: inline-block; padding: 14px 32px; border-radius: 50px;
    background: linear-gradient(135deg, #E91E8C 0%, #c01874 100%);
    color: #fff; text-decoration: none; font-weight: 600; font-size: 0.95rem;
    box-shadow: 0 8px 20px rgba(233, 30, 140, 0.35);
    transition: transform 0.3s, box-shadow 0.3s;
  }
  .btn:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(233, 30, 140, 0.45); }
</style>
</head>
<body>
<div class="wrap">
  <div class="code">404</div>
  <h1>Sahifa topilmadi</h1>
  <p>Kechirasiz, siz qidirayotgan sahifa mavjud emas yoki ko'chirilgan. Bosh sahifaga qaytishingiz mumkin.</p>
  <a href="/" class="btn">Bosh sahifaga qaytish</a>
</div>
</body>
